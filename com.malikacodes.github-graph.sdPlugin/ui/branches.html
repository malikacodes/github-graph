<!DOCTYPE html>
<html>

<head lang="en">
    <title>Branch Map Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <link rel="stylesheet" href="github-key.css" />
</head>

<body>
    <!--
        The repo belongs to this dial, so it isn't global. Dials showing the
        same repo share one map. It's the same picker as the GitHub keys
        (picker.js), and its first choice, "Follow the Repo key", lets the
        dials switch repos along with the keys. There's no Status line here
        because this dial has room for words: anything wrong shows on the
        strip itself.
    -->
    <sdpi-item label="Repo">
        <div id="picker"></div>
    </sdpi-item>

    <!-- The same token and timer every GitHub Graph dial and key shares. -->
    <sdpi-item label="GitHub Token">
        <sdpi-password setting="token" global placeholder="Paste your token"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Refresh Every">
        <sdpi-select setting="refreshMinutes" global default="30">
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
        </sdpi-select>
    </sdpi-item>
    <script src="picker.js"></script>
</body>

</html>
