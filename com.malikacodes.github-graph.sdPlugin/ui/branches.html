<!DOCTYPE html>
<html>

<head lang="en">
    <title>Branch Map Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        The repo belongs to this dial, so it has no "global" on it. Dials
        set to the same repo share one map. The list comes from the plugin
        (getRepos in branch-network.ts), so it's only the repos the token
        can see. hot-reload asks again every time the page opens, so a new
        repo or a new token shows up without restarting anything. There's
        no Status line here because this dial has room for words: anything
        wrong shows on the strip itself.
    -->
    <sdpi-item label="Repo">
        <sdpi-select setting="repo" datasource="getRepos" hot-reload loading="Loading repos..." placeholder="Pick a repo"></sdpi-select>
    </sdpi-item>

    <!-- The same token and timer every GitHub Graph dial and key shares. -->
    <sdpi-item label="GitHub Token">
        <sdpi-password setting="token" global placeholder="Paste your token"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Refresh Every">
        <sdpi-select setting="refreshMinutes" global default="30">
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
        </sdpi-select>
    </sdpi-item>
</body>

</html>
