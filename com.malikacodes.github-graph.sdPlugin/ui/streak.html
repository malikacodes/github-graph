<!DOCTYPE html>
<html>

<head lang="en">
    <title>Streak Counter Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        These two have no "global" on them, so they save to this one key. Two
        streak keys can count two different ways, like one daily and one
        weekly. What's shown at first (Daily, 1) is only what the page
        displays. Nothing is saved until I pick something, so the plugin also
        treats a missing mode as daily and missing grace days as 1.
    -->
    <sdpi-item label="Streak Mode">
        <sdpi-radio setting="mode" default="daily">
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays only</option>
            <option value="weekly">Weekly</option>
        </sdpi-radio>
    </sdpi-item>

    <!--
        A grace day is a missed day the streak is allowed to survive: with 1,
        one day off doesn't end it, but two in a row do. Missed days never
        add to the count, and weekly mode doesn't use them.
    -->
    <sdpi-item label="Grace Days">
        <sdpi-select setting="graceDays" value-type="number" default="1">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </sdpi-select>
    </sdpi-item>

    <!--
        These two have "global" on them, so they save to the plugin's global
        settings and every GitHub Graph dial and key shares the same token and timer.
    -->
    <sdpi-item label="GitHub Token">
        <sdpi-password setting="token" global placeholder="Paste your token"></sdpi-password>
    </sdpi-item>

    <sdpi-item label="Refresh Every">
        <sdpi-select setting="refreshMinutes" global default="30">
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
        </sdpi-select>
    </sdpi-item>
</body>

</html>
